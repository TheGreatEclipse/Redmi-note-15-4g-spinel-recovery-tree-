name: Build TWRP (twrp-14.1) - spinel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.mk'
      - '**.bp'
      - '**.rc'
      - '**.sh'
      - 'prebuilt/**'

env:
  DEVICE_NAME: spinel
  DEVICE_PATH: device/xiaomi/spinel

jobs:
  build-twrp:
    name: Build TWRP Latest
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          large-packages: true
          swap-storage: false

      - name: Add swap space (12 GB)
        run: |
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Set up build environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lz4 openjdk-11-jdk \
            pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python-is-python3 libtinfo5
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          git config --global user.email "ci@spinel"
          git config --global user.name "CI"

      - name: Repo init + sync TWRP 14.1
        run: |
          export PATH="$HOME/bin:$PATH"
          mkdir -p $GITHUB_WORKSPACE/twrp
          cd $GITHUB_WORKSPACE/twrp
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-14.1 --depth=1 --no-repo-verify
          repo sync -j$(nproc) -c --force-sync --no-clone-bundle --no-tags \
            --optimized-fetch --prune 2>&1 | tail -30

      - name: Copy device tree
        run: |
          mkdir -p $GITHUB_WORKSPACE/twrp/$DEVICE_PATH
          cp -r $GITHUB_WORKSPACE/device_tree/. \
                $GITHUB_WORKSPACE/twrp/$DEVICE_PATH/
          # FIX: Remove vendorsetup.sh - causes OrangeFox env conflict in TWRP build
          # Without this, "lunch twrp_spinel-eng" fails because OrangeFox env is loaded
          rm -f $GITHUB_WORKSPACE/twrp/$DEVICE_PATH/vendorsetup.sh
          echo "Device tree copied (vendorsetup.sh removed for TWRP build):"
          ls -la $GITHUB_WORKSPACE/twrp/$DEVICE_PATH/

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: twrp-${{ env.DEVICE_NAME }}-${{ github.sha }}
          restore-keys: twrp-${{ env.DEVICE_NAME }}-

      - name: Configure ccache
        run: ccache -M 8G

      - name: Build TWRP vendor_boot image
        run: |
          export PATH="$HOME/bin:$PATH"
          cd $GITHUB_WORKSPACE/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL="C"
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)
          source build/envsetup.sh
          # twrp_spinel-eng registered via COMMON_LUNCH_CHOICES in AndroidProducts.mk
          lunch twrp_spinel-eng
          mka vendorbootimage 2>&1 | tail -100

      - name: Verify output
        run: |
          ls -lh $GITHUB_WORKSPACE/twrp/out/target/product/spinel/ || true

      - name: Upload TWRP artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: TWRP-14.1-spinel-${{ github.run_number }}
          path: |
            ${{ github.workspace }}/twrp/out/target/product/spinel/vendor_boot.img
          retention-days: 30
