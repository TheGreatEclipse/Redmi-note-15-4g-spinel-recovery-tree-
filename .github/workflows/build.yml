name: OrangeFox Official Build (spinel)

on:
  push:
    branches: [ "android-12.1" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create GitHub Release"
        required: false
        default: false
        type: boolean
      sync_msms:
        description: "Apply MSMS decryption patches (Qualcomm only)"
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    env:
      DEVICE: "spinel"
      DEVICE_PATH: "device/xiaomi/spinel"
      MANIFEST_BRANCH: "12.1"
      SOC_FAMILY: "mtk"

    steps:
      - name: Checkout device tree repo
        uses: actions/checkout@v4
        with:
          path: ${{ env.DEVICE_PATH }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip fontconfig python3 python3-pip \
            bc lzop pngcrush rsync schedtool ccache openjdk-11-jdk

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Init and sync OrangeFox sources (official method)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/OrangeFox_sync"
          cd "$GITHUB_WORKSPACE/OrangeFox_sync"
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git
          cd sync
          ./orangefox_sync.sh --branch "${MANIFEST_BRANCH}" --path "$GITHUB_WORKSPACE/OrangeFox"

      - name: Place device tree
        run: |
          DEST="$GITHUB_WORKSPACE/OrangeFox/${DEVICE_PATH}"
          rm -rf "$DEST"
          mkdir -p "$(dirname "$DEST")"
          cp -r "$GITHUB_WORKSPACE/${DEVICE_PATH}" "$DEST"

      - name: Apply MSMS decryption patches (Qualcomm only)
        if: ${{ inputs.sync_msms == true && env.SOC_FAMILY == 'msm' }}
        working-directory: OrangeFox
        run: |
          cd bootable/recovery
          git remote add ofox-upstream https://gitlab.com/OrangeFox/bootable/Recovery.git 2>/dev/null || true
          git fetch ofox-upstream fox_${{ env.MANIFEST_BRANCH }} --depth=1
          echo "OrangeFox Recovery upstream fetched."

      - name: Build vendor_boot image
        run: |
          cd "$GITHUB_WORKSPACE/OrangeFox"
          export ALLOW_MISSING_DEPENDENCIES=true
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)
          source build/envsetup.sh
          lunch fox_${DEVICE}-eng
          mka vendorbootimage -j"$(nproc)"

      - name: Export build info
        run: |
          OUT_DIR="$GITHUB_WORKSPACE/OrangeFox/out/target/product/${DEVICE}"
          echo "OUT_DIR=$OUT_DIR" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date +%Y%m%d)" >> "$GITHUB_ENV"
          ls -lh "$OUT_DIR"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-${{ env.DEVICE }}-${{ env.BUILD_DATE }}
          path: |
            ${{ env.OUT_DIR }}/vendor_boot.img
            ${{ env.OUT_DIR }}/OrangeFox*.zip
          if-no-files-found: warn
          retention-days: 7

      - name: Create release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: OFOX-${{ env.DEVICE }}-${{ env.BUILD_DATE }}-${{ github.run_number }}
          name: OrangeFox R12 spinel ${{ env.BUILD_DATE }}
          files: |
            ${{ env.OUT_DIR }}/vendor_boot.img
            ${{ env.OUT_DIR }}/OrangeFox*.zip
          fail_on_unmatched_files: false
