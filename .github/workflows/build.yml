name: OrangeFox Build - spinel

on:
  push:
    branches: [main, android-12.1]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: device/xiaomi/spinel

      - name: Cleanup & Swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Install Build Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32z1-dev liblz4-tool libncurses5 libssl-dev libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3
          # تثبيت repo يدوياً (الطريقة المضمونة)
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Sync OrangeFox
        run: |
          mkdir of_source
          cd of_source
          # استخدام المانيفست الرسمي مباشرة لتجنب مشاكل السكربتات
          repo init -u https://gitlab.com/OrangeFox/sync.git -b fox_12.1 --depth=1
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags

      - name: Build
        run: |
          cd of_source
          # التأكد من مكان التري
          rm -rf device/xiaomi/spinel
          mkdir -p device/xiaomi
          cp -r ../device/xiaomi/spinel device/xiaomi/
          
          # إعداد البيئة والبناء
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=spinel
          source build/envsetup.sh
          lunch fox_spinel-eng || lunch twrp_spinel-eng
          mka vendorbootimage -j$(nproc)

      - name: Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-spinel-Success
          path: of_source/out/target/product/spinel/vendor_boot.img
