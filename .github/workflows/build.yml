name: Build OrangeFox R12 - spinel

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DEVICE_NAME: spinel
  DEVICE_PATH: device/xiaomi/spinel

jobs:
  build:
    name: OrangeFox R12 vendor_boot
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          large-packages: true
          swap-storage: false

      - name: Add swap (12GB)
        run: |
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg \
            lib32ncurses5-dev lib32z1-dev liblz4-tool \
            libncurses5 libssl-dev lz4 openjdk-11-jdk \
            python3 python-is-python3 rsync zip
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
            -o ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          git config --global user.email "build@local"
          git config --global user.name "Builder"

      - name: Sync OrangeFox R12 sources
        run: |
          mkdir -p $GITHUB_WORKSPACE/OrangeFox_sync
          cd $GITHUB_WORKSPACE/OrangeFox_sync
          git clone https://gitlab.com/OrangeFox/sync.git --depth=1
          cd sync
          ./orangefox_sync.sh --branch 12.1 \
            --path $GITHUB_WORKSPACE/OrangeFox

      - name: Place device tree
        run: |
          DEST=$GITHUB_WORKSPACE/OrangeFox/${{ env.DEVICE_PATH }}
          mkdir -p "$DEST"
          cp -r $GITHUB_WORKSPACE/device_tree/. "$DEST/"

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ofox-spinel-${{ github.sha }}
          restore-keys: ofox-spinel-

      - name: Build OrangeFox
        run: |
          cd $GITHUB_WORKSPACE/OrangeFox
          export ALLOW_MISSING_DEPENDENCIES=true
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)
          ccache -M 8G
          export FOX_BUILD_DEVICE=spinel
          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1
          export FOX_VENDOR_BOOT_RECOVERY=1
          source build/envsetup.sh
          lunch fox_spinel-eng
          mka vendorbootimage -j$(nproc) 2>&1 | tee /tmp/build.log
          echo "=== LAST 50 LINES ===" && tail -50 /tmp/build.log

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-spinel-${{ github.run_number }}
          path: |
            ${{ github.workspace }}/OrangeFox/out/target/product/spinel/vendor_boot.img
            ${{ github.workspace }}/OrangeFox/out/target/product/spinel/OrangeFox*.zip
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: /tmp/build.log
          retention-days: 7
