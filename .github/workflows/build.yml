name: OrangeFox Build - spinel

on:
  push:
    branches: [main, android-12.1]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Free Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git-repo python3 curl rsync bc bison build-essential libssl-dev lz4
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Sync OrangeFox
        run: |
          git clone https://gitlab.com/OrangeFox/sync.git --depth=1 sync_repo
          cd sync_repo
          # السكربت هو اللي بيعرف يتعامل مع فرع 12.1
          ./orangefox_sync.sh --branch 12.1 --path $GITHUB_WORKSPACE/fox_src

      - name: Place Tree
        run: |
          # حط التري في المكان الصح
          mkdir -p $GITHUB_WORKSPACE/fox_src/device/xiaomi/spinel
          cp -r $GITHUB_WORKSPACE/device_tree/. $GITHUB_WORKSPACE/fox_src/device/xiaomi/spinel/

      - name: Build
        run: |
          cd $GITHUB_WORKSPACE/fox_src
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          # جرب fox_spinel ولو فشل جرب twrp_spinel كاحتياط
          lunch fox_spinel-eng || lunch twrp_spinel-eng
          mka vendorbootimage -j$(nproc)

      - name: Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-spinel
          path: fox_src/out/target/product/spinel/vendor_boot.img
