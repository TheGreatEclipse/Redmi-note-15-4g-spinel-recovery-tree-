name: Build OrangeFox Recovery - Redmi Note 15 4G (spinel)

on:
  push:
    branches: [ main, android-12.1 ]
  workflow_dispatch:
    inputs:
      SYNC_MSMS:
        description: "Sync MSMS decryption patches (Qualcomm only)"
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build OrangeFox for spinel
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    env:
      DEVICE_CODENAME: spinel
      DEVICE_PATH: device/xiaomi/spinel
      MANIFEST_BRANCH: 12.1
      SOC_FAMILY: mtk
      OUT_DIR: OrangeFox_src/out/target/product/spinel

# ─────────────────────────────────────────────
# DEVICE TREE
# ─────────────────────────────────────────────

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: OrangeFox_src/device/xiaomi/spinel

# ─────────────────────────────────────────────
# FREE SPACE
# ─────────────────────────────────────────────

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
                      /opt/ghc /usr/local/.ghcup
          sudo apt-get clean
          df -h

# ─────────────────────────────────────────────
# DEPENDENCIES (MINIMAL FAST)
# ─────────────────────────────────────────────

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git-core flex bison build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            libncurses5-dev lib32z1-dev libxml2-utils \
            xsltproc unzip python3 rsync ccache openjdk-11-jdk

# ─────────────────────────────────────────────
# REPO TOOL
# ─────────────────────────────────────────────

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

# ─────────────────────────────────────────────
# CCACHE (FAST REBUILD)
# ─────────────────────────────────────────────

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ env.DEVICE_CODENAME }}
          restore-keys: ccache-${{ runner.os }}-

# ─────────────────────────────────────────────
# INIT ORANGEFOX
# ─────────────────────────────────────────────

      - name: Init OrangeFox
        run: |
          mkdir -p OrangeFox_src
          cd OrangeFox_src
          repo init -u https://gitlab.com/OrangeFox/manifest.git \
            -b fox_${{ env.MANIFEST_BRANCH }} --depth=1

# ─────────────────────────────────────────────
# SYNC SOURCE (FAST MODE)
# ─────────────────────────────────────────────

      - name: Sync source
        run: |
          cd OrangeFox_src
          repo sync -c \
            --current-branch \
            --no-tags \
            --no-clone-bundle \
            --optimized-fetch \
            --prune \
            -j$(nproc)

# ─────────────────────────────────────────────
# PATCH (MSMS OPTIONAL)
# ─────────────────────────────────────────────

      - name: Apply MSMS patches
        if: ${{ inputs.SYNC_MSMS == true && env.SOC_FAMILY == 'msm' }}
        run: |
          cd OrangeFox_src/bootable/recovery || exit 0
          git remote add ofox-upstream \
            https://gitlab.com/OrangeFox/bootable/Recovery.git 2>/dev/null || true
          git fetch ofox-upstream fox_${{ env.MANIFEST_BRANCH }} --depth=1

# ─────────────────────────────────────────────
# BUILD ENV
# ─────────────────────────────────────────────

      - name: Build setup
        run: |
          cd OrangeFox_src
          source build/envsetup.sh

# ─────────────────────────────────────────────
# BUILD STEP (LOG CAPTURED)
# ─────────────────────────────────────────────

      - name: Build recovery
        run: |
          cd OrangeFox_src

          export USE_CCACHE=1
          export CCACHE_DIR=$HOME/.ccache
          export CCACHE_EXEC=$(which ccache)

          export ALLOW_MISSING_DEPENDENCIES=true
          export BUILD_BROKEN_USES_BUILD_COPY_HEADERS=true
          export BUILD_BROKEN_VENDOR_PROPERTY_NAMESPACE=true

          source build/envsetup.sh
          lunch fox_${{ env.DEVICE_CODENAME }}-eng

          mka vendorbootimage -j$(nproc) 2>&1 | tee /tmp/build.log
          BUILD_EXIT=${PIPESTATUS[0]}

          exit $BUILD_EXIT

# ─────────────────────────────────────────────
# OUTPUT CHECK
# ─────────────────────────────────────────────

      - name: Check output
        run: |
          if [ -f "$OUT_DIR/vendor_boot.img" ]; then
            echo "BUILD_OK=true" >> $GITHUB_ENV
          else
            echo "BUILD_OK=false" >> $GITHUB_ENV
            exit 1
          fi

# ─────────────────────────────────────────────
# ARTIFACT UPLOAD
# ─────────────────────────────────────────────

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-spinel
          path: |
            OrangeFox_src/out/target/product/spinel/vendor_boot.img
            OrangeFox_src/out/target/product/spinel/*.zip

# ─────────────────────────────────────────────
# TELEGRAM SUCCESS (LOG INCLUDED)
# ─────────────────────────────────────────────

      - name: Telegram success + log
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TG_CHAT_ID }}" \
            -d text="✅ BUILD SUCCESS%0A%0A📱 Device: spinel%0A⚡ OrangeFox/TWRP build complete%0A📦 Uploading log..."
          if [ -f /tmp/build.log ]; then
            gzip -f /tmp/build.log
            curl -s \
              -F chat_id="${{ secrets.TG_CHAT_ID }}" \
              -F document=@/tmp/build.log.gz \
              "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendDocument"
          fi

# ─────────────────────────────────────────────
# TELEGRAM FAILURE (LOG INCLUDED)
# ─────────────────────────────────────────────

      - name: Telegram failure + log
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TG_CHAT_ID }}" \
            -d text="❌ BUILD FAILED%0A%0A📱 Device: spinel%0A🔍 Sending build log..."
          if [ -f /tmp/build.log ]; then
            gzip -f /tmp/build.log
            curl -s \
              -F chat_id="${{ secrets.TG_CHAT_ID }}" \
              -F document=@/tmp/build.log.gz \
              "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendDocument"
          fi
