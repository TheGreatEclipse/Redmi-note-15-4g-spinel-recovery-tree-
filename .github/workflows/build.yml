name: Build OrangeFox R12 - spinel

on:
  push:
    branches: [main, android-12.1]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: device/xiaomi/spinel

      - name: Free Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install Repo
        run: |
          mkdir ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Sync OrangeFox
        run: |
          mkdir of
          cd of
          repo init -u https://gitlab.com/OrangeFox/sync.git -b 12.1 --depth=1
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags

      - name: Build
        run: |
          cd of
          # نقل التري للمكان الصح
          rm -rf device/xiaomi/spinel
          mkdir -p device/xiaomi
          cp -r ../device/xiaomi/spinel device/xiaomi/
          
          # البناء
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch fox_spinel-eng || (echo "Lunch failed, trying manual" && lunch twrp_spinel-eng)
          mka vendorbootimage -j$(nproc)
