name: Build OrangeFox R12 – spinel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.mk'
      - '**.bp'
      - '**.rc'
      - '**.sh'
      - 'prebuilt/**'

env:
  DEVICE_NAME: spinel
  DEVICE_PATH: device/xiaomi/spinel

jobs:
  build-orangefox:
    name: Build OrangeFox R12
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      # ── 1. Checkout device tree ──────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: device_tree

      # ── 2. Free disk space ──────────────────────────────────────
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          large-packages: true
          swap-storage: false

      # ── 3. Swap ──────────────────────────────────────────────────
      - name: Add swap space (12 GB)
        run: |
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      # ── 4. Build environment ──────────────────────────────────────
      - name: Set up build environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lz4 openjdk-11-jdk \
            pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python-is-python3 libtinfo5
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          git config --global user.email "ci@spinel"
          git config --global user.name "CI"

      # ── 5. Sync OrangeFox R12 ───────────────────────────────────
      - name: Sync OrangeFox R12 (via orangefox_sync.sh)
        run: |
          export PATH="$HOME/bin:$PATH"
          mkdir -p $GITHUB_WORKSPACE/OrangeFox
          cd $GITHUB_WORKSPACE/OrangeFox
          git clone https://gitlab.com/OrangeFox/sync.git --depth=1
          cd sync && chmod +x orangefox_sync.sh
          ./orangefox_sync.sh --branch 12.1 \
            --path $GITHUB_WORKSPACE/OrangeFox/fox_12.1 --ssh 0 2>&1 | tail -50

      # ── 6. Copy device tree ─────────────────────────────────────
      - name: Copy device tree
        run: |
          mkdir -p $GITHUB_WORKSPACE/OrangeFox/fox_12.1/$DEVICE_PATH
          cp -r $GITHUB_WORKSPACE/device_tree/. \
                $GITHUB_WORKSPACE/OrangeFox/fox_12.1/$DEVICE_PATH/

      # ── 7. ccache ───────────────────────────────────────────────
      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ofox-${{ env.DEVICE_NAME }}-${{ github.sha }}
          restore-keys: ofox-${{ env.DEVICE_NAME }}-

      - name: Configure ccache
        run: ccache -M 8G

      # ── 8. Build OrangeFox vendor_boot ──────────────────────────
      - name: Build OrangeFox R12 vendor_boot image
        run: |
          export PATH="$HOME/bin:$PATH"
          cd $GITHUB_WORKSPACE/OrangeFox/fox_12.1
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL="C"
          export FOX_BUILD_DEVICE=spinel
          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1
          export FOX_VENDOR_BOOT_RECOVERY=1
          export FOX_VANILLA_BUILD=1
          export OF_FORCE_PREBUILT_KERNEL=1
          export OF_ENABLE_LPTOOLS=1
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)
          source build/envsetup.sh
          lunch fox_spinel-eng
          mka vendorbootimage 2>&1 | tail -100

      # ── 9. Verify output ────────────────────────────────────────
      - name: Verify output
        run: |
          ls -lh $GITHUB_WORKSPACE/OrangeFox/fox_12.1/out/target/product/spinel/ || true

      # ── 10. Upload artifacts ─────────────────────────────────────
      - name: Upload OrangeFox artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: OrangeFox-R12-spinel-${{ github.run_number }}
          path: |
            ${{ github.workspace }}/OrangeFox/fox_12.1/out/target/product/spinel/OrangeFox*.img
            ${{ github.workspace }}/OrangeFox/fox_12.1/out/target/product/spinel/OrangeFox*.zip
            ${{ github.workspace }}/OrangeFox/fox_12.1/out/target/product/spinel/vendor_boot.img
          retention-days: 30
