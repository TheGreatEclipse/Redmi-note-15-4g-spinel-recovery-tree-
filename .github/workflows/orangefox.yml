name: Build OrangeFox Recovery - Redmi spinel

on:
  push:
    branches: [ main, android-12.1 ]
  workflow_dispatch:
    inputs:
      SYNC_MSMS:
        description: 'Sync MSMS decryption patches'
        required: false
        default: 'true'
        type: boolean

jobs:
  build:
    name: Build OrangeFox for spinel
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      DEVICE_CODENAME:   spinel
      DEVICE_PATH:       device/xiaomi/spinel
      MANIFEST_BRANCH:   12.1
      DUMP_RAW_BASE:     https://github.com/mkpromvp/Stock-rom-dumber/tree/dump-redmi-spinel-os3.0.301.0.wpgmixm

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: ${{ env.DEVICE_PATH }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
                      /opt/ghc /usr/local/.ghcup
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            libncurses5 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
            xsltproc unzip fontconfig python3 python3-pip bc \
            lzop pngcrush rsync schedtool ccache openjdk-11-jdk aria2

      - name: Configure git
        run: |
          git config --global user.name  "AKRO-Build"
          git config --global user.email "build@localhost"
          git config --global color.ui   false

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
            -o ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Setup build environment
        run: |
          git clone https://gitlab.com/OrangeFox/misc/scripts /tmp/ofox_scripts
          cd /tmp/ofox_scripts
          sudo bash setup/android_build_env.sh

      - name: Init and Sync OrangeFox manifest
        run: |
          mkdir -p $GITHUB_WORKSPACE/OrangeFox_src
          git clone https://gitlab.com/OrangeFox/sync.git /tmp/ofox_sync
          cd /tmp/ofox_sync
          ./orangefox_sync.sh \
            --branch ${{ env.MANIFEST_BRANCH }} \
            --path $GITHUB_WORKSPACE/OrangeFox_src

      - name: Place device tree
        run: |
          DEST="$GITHUB_WORKSPACE/OrangeFox_src/${{ env.DEVICE_PATH }}"
          rm -rf "$DEST"
          cp -r "$GITHUB_WORKSPACE/${{ env.DEVICE_PATH }}" "$DEST"

      - name: Download prebuilt kernel
        run: |
          PREBUILT_DIR="$GITHUB_WORKSPACE/OrangeFox_src/${{ env.DEVICE_PATH }}/prebuilt"
          mkdir -p "$PREBUILT_DIR"
          if [ -f "$PREBUILT_DIR/kernel" ]; then
            echo "Kernel already present — skipping."
          else
            echo "Downloading kernel from stock dump..."
            curl -fL \
              "${{ env.DUMP_RAW_BASE }}/boot/kernel" \
              -o "$PREBUILT_DIR/kernel"
            echo "Done: $(ls -lh $PREBUILT_DIR/kernel)"
          fi
          if [ -f "$PREBUILT_DIR/dtb.img" ]; then
            echo "dtb.img already present."
          else
            echo "::warning::dtb.img not found in prebuilt!"
          fi

      - name: Apply MSMS decryption patches
        if: ${{ github.event.inputs.SYNC_MSMS != 'false' }}
        working-directory: OrangeFox_src
        run: |
          cd bootable/recovery
          git remote add ofox-upstream \
            https://gitlab.com/OrangeFox/bootable/Recovery.git 2>/dev/null || true
          git fetch ofox-upstream fox_${{ env.MANIFEST_BRANCH }} --depth=1
          echo "OrangeFox Recovery upstream fetched."

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 2G
          key: ofox-fire-${{ env.MANIFEST_BRANCH }}

      - name: Build OrangeFox
        working-directory: OrangeFox_src
        run: |
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)
          export CCACHE_DIR=/tmp/ccache
          export ALLOW_MISSING_DEPENDENCIES=true
          export BUILD_BROKEN_USES_BUILD_COPY_HEADERS=true
          export BUILD_BROKEN_VENDOR_PROPERTY_NAMESPACE=true
          set +e
          source build/envsetup.sh
          set -e
          lunch twrp_${{ env.DEVICE_CODENAME }}-eng
          mka adbd vendorbootimage -j$(nproc) 2>&1 | tee /tmp/build.log
          BUILD_EXIT=${PIPESTATUS[0]}

          echo "=== BUILD ERRORS & WARNINGS ===" > /tmp/build_errors.log
          echo "Run #${{ github.run_number }} — $(date)" >> /tmp/build_errors.log
          echo "========================================" >> /tmp/build_errors.log
          grep -iE "^(.*error:|.*warning:|make:|FAILED:|ninja:|fatal:)" /tmp/build.log \
            >> /tmp/build_errors.log || true
          echo "" >> /tmp/build_errors.log
          echo "=== LAST 100 LINES ===" >> /tmp/build_errors.log
          tail -100 /tmp/build.log >> /tmp/build_errors.log

          exit $BUILD_EXIT

      - name: Check output files
        run: |
          OUT_DIR="$GITHUB_WORKSPACE/OrangeFox_src/out/target/product/${{ env.DEVICE_CODENAME }}"
          echo "OUT_DIR=$OUT_DIR" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV

          echo "=== Files in OUT_DIR ==="
          ls -lh "$OUT_DIR/" || echo "OUT_DIR not found!"

          if [ -f "$OUT_DIR/vendor_boot.img" ]; then
            echo "CHECK_VENDOR_BOOT=true" >> $GITHUB_ENV
            echo "MD5_IMG=$(md5sum $OUT_DIR/vendor_boot.img | cut -d ' ' -f 1)" >> $GITHUB_ENV
            echo "✅ vendor_boot.img found"
          else
            echo "CHECK_VENDOR_BOOT=false" >> $GITHUB_ENV
            echo "::error::vendor_boot.img NOT found!"
          fi

          if ls "$OUT_DIR"/OrangeFox*.zip 2>/dev/null; then
            echo "CHECK_ZIP=true" >> $GITHUB_ENV
            echo "MD5_ZIP=$(md5sum $OUT_DIR/OrangeFox*.zip | cut -d ' ' -f 1)" >> $GITHUB_ENV
            echo "✅ OrangeFox zip found"
          else
            echo "CHECK_ZIP=false" >> $GITHUB_ENV
            echo "::warning::OrangeFox zip not found"
          fi

      - name: Upload recovery artifact
        if: env.CHECK_VENDOR_BOOT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-${{ env.MANIFEST_BRANCH }}-fire-AKRO-${{ env.BUILD_DATE }}
          path: |
            ${{ env.OUT_DIR }}/vendor_boot.img
            ${{ env.OUT_DIR }}/OrangeFox*.zip
          if-no-files-found: warn
          retention-days: 7

      - name: Upload build errors log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-errors-fire-${{ github.run_number }}
          path: /tmp/build_errors.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Collect all logs on failure
        if: failure()
        run: |
          mkdir -p /tmp/fail_logs
          [ -f /tmp/build.log ]        && cp /tmp/build.log        /tmp/fail_logs/ || true
          [ -f /tmp/build_errors.log ] && cp /tmp/build_errors.log /tmp/fail_logs/ || true
          find $GITHUB_WORKSPACE/OrangeFox_src/out -name "*.log" 2>/dev/null \
            | head -20 \
            | xargs -I{} sh -c 'cp "{}" /tmp/fail_logs/$(basename "{}")' || true
          echo "=== ENV DUMP ===" > /tmp/fail_logs/env.log
          env >> /tmp/fail_logs/env.log

      - name: Upload all logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-fire-${{ github.run_number }}
          path: /tmp/fail_logs/
          retention-days: 7

      - name: Create GitHub Release
        if: env.CHECK_VENDOR_BOOT == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: AKRO-${{ github.run_number }}
          name: "OrangeFox fire AKRO Build #${{ github.run_number }}"
          fail_on_unmatched_files: false
          body: |
            **Device:** Redmi 12 (fire) — MT6768
            **ROM Base:** HyperOS 2.0.207.0.VMXMIXM (Android 15)
            **OrangeFox branch:** ${{ env.MANIFEST_BRANCH }}
            **Maintainer:** AKRO — UNOFFICIAL
            **Date:** ${{ env.BUILD_DATE }}
            **MD5 (vendor_boot):** ${{ env.MD5_IMG }}
            **MD5 (zip):** ${{ env.MD5_ZIP }}

            ### Flash
            ```
            fastboot flash vendor_boot vendor_boot.img
            ```
            - A/B device — الريكفري جوه vendor_boot
            - FBE decryption لـ HyperOS 2 / Android 15
          files: |
            ${{ env.OUT_DIR }}/vendor_boot.img
            ${{ env.OUT_DIR }}/OrangeFox*.zip
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
