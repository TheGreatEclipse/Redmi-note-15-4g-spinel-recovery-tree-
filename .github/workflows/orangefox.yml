name: Build OrangeFox R12 - spinel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.mk'
      - '**.bp'
      - '**.rc'
      - '**.sh'
      - 'prebuilt/**'

env:
  DEVICE_NAME: spinel
  DEVICE_PATH: device/xiaomi/spinel

jobs:
  build-orangefox:
    name: Build OrangeFox R12
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          large-packages: true
          swap-storage: false

      - name: Add swap space (12 GB)
        run: |
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Set up build environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lz4 openjdk-11-jdk \
            pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python-is-python3 libtinfo5
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          git config --global user.email "ci@spinel"
          git config --global user.name "CI"

      - name: Sync OrangeFox R12 via repo manifest
        run: |
          export PATH="$HOME/bin:$PATH"
          mkdir -p $GITHUB_WORKSPACE/OrangeFox/fox_12.1
          cd $GITHUB_WORKSPACE/OrangeFox/fox_12.1
          repo init \
            -u https://gitlab.com/OrangeFox/Manifest.git \
            -b fox_12.1 \
            --depth=1 \
            --no-repo-verify
          repo sync -j$(nproc) -c --force-sync \
            --no-clone-bundle --no-tags \
            --optimized-fetch --prune 2>&1 | tail -50
          echo "OrangeFox R12 sync complete"

      - name: Copy device tree
        run: |
          FOXDIR=$GITHUB_WORKSPACE/OrangeFox/fox_12.1
          mkdir -p $FOXDIR/$DEVICE_PATH
          cp -r $GITHUB_WORKSPACE/device_tree/. $FOXDIR/$DEVICE_PATH/
          ls -la $FOXDIR/$DEVICE_PATH/

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ofox-${{ env.DEVICE_NAME }}-${{ github.sha }}
          restore-keys: ofox-${{ env.DEVICE_NAME }}-

      - name: Configure ccache
        run: ccache -M 8G

      - name: Build OrangeFox R12 vendor_boot image
        run: |
          export PATH="$HOME/bin:$PATH"
          FOXDIR=$GITHUB_WORKSPACE/OrangeFox/fox_12.1
          cd $FOXDIR
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export FOX_BUILD_DEVICE=${DEVICE_NAME}
          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1
          export FOX_VENDOR_BOOT_RECOVERY=1
          export FOX_VANILLA_BUILD=1
          export OF_FORCE_PREBUILT_KERNEL=1
          export OF_ENABLE_LPTOOLS=1
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)
          source build/envsetup.sh
          lunch fox_spinel-eng
          mka vendorbootimage -j$(nproc) 2>&1 | tail -100

      - name: Verify output
        run: |
          ls -lh $GITHUB_WORKSPACE/OrangeFox/fox_12.1/out/target/product/spinel/ || true

      - name: Upload OrangeFox artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: OrangeFox-R12-spinel-${{ github.run_number }}
          path: |
            ${{ github.workspace }}/OrangeFox/fox_12.1/out/target/product/spinel/OrangeFox*.img
            ${{ github.workspace }}/OrangeFox/fox_12.1/out/target/product/spinel/OrangeFox*.zip
            ${{ github.workspace }}/OrangeFox/fox_12.1/out/target/product/spinel/vendor_boot.img
          retention-days: 30
